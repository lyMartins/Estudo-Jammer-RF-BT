[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Velocidade de upload
upload_speed   = 921600
monitor_speed  = 115200

; Bibliotecas necessárias
lib_deps =
    nRF24/RF24 @ ^1.4.8
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

; Flags de compilação
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2
